                    if (err.code === 'auth/email-already-in-use') setAuthError('این نام کاربری قبلاً توسط شخص دیگری ثبت شده!');
                    else if (err.code === 'auth/invalid-credential') setAuthError('نام کاربری یا رمز عبور اشتباه است!');
                    else setAuthError('خطای سرور: ' + err.message);
                }
            };

            const handleLogout = async () => {
                triggerHaptic();
                await window.FirebaseAPI.signOut(window.auth);
                setIsDbReady(false);
                setActiveTab('planner');
            };

            const handleUpdateSlide = (exId, subId, slides) => {
                setExams(prev => prev.map(ex => ex.id === exId ? { ...ex, subjects: ex.subjects.map(s => s.id === subId ? { ...s, slides: parseInt(slides) || 0 } : s) } : ex));
            };

            const toggleTimer = (t) => {
                triggerHaptic();
                if (activeTimer.key === t.key) setActiveTimer(prev => ({ ...prev, isRunning: !prev.isRunning }));
                else setActiveTimer({ key: t.key, timeLeft: POMODORO_TIME, isRunning: true, amt: t.amt });
            };

            const stopTimer = () => { triggerHaptic(); setActiveTimer({ key: null, timeLeft: POMODORO_TIME, isRunning: false, amt: 0 }); };

            const activateRebalance = (nearestId) => {
                const targetDate = new Date(); targetDate.setDate(targetDate.getDate() + 3);
                setRebalance({ active: true, until: getLocalISODate(targetDate), nearestExamId: nearestId });
                setModal({ open: false });
            };

            const setTask = (key, amt, stat, custom = false) => {
                triggerHaptic();
                setRecords(prev => ({ ...prev, [key]: { amount: amt, status: stat, isCustom: custom } }));
                if (activeTimer.key === key) stopTimer();

                if (stat === 'missed') {
                    const newStreak = missedStreak + 1;
                    setMissedStreak(newStreak);
                    if (newStreak >= 3) {
                        const sortedExams = [...exams].sort((a, b) => new Date(a.date) - new Date(b.date));
                        if (sortedExams.length > 1) {
                            setModal({ open: true, type: 'rebalance', data: { nearest: sortedExams[0] } });
                        }
                        setMissedStreak(0);
                    }
                } else if (stat === 'done') {
                    setMissedStreak(0);
                }
            };

            const undoTask = (key) => {
                triggerHaptic();
                setRecords(prev => { const n = { ...prev }; delete n[key]; return n; });
            };

            // محاسبات زمان‌بندی
            const schedule = useMemo(() => {
                if (!startDate) return []; 
                const plan = [];
                const left = {};
                exams.forEach(ex => ex.subjects.forEach(s => left[s.id] = { 1: s.slides, 2: s.slides, 3: s.slides }));

                const sDate = new Date(startDate + 'T00:00:00');
                const mDate = new Date(Math.max(...exams.map(e => new Date(e.date + 'T00:00:00'))));
                let curr = new Date(sDate);
                let absoluteDayCount = 1;

                while (curr < mDate) {
                    const dStr = getLocalISODate(curr);
                    const currentInternalDay = absoluteDayCount;
                    absoluteDayCount++;

                    if (skipped.includes(dStr)) { curr.setDate(curr.getDate() + 1); continue; }

                    const tasks = [];
                    exams.forEach(ex => {
                        const exDate = new Date(ex.date + 'T00:00:00');
                        if (curr >= exDate) return;

                        const totalDays = Math.ceil((exDate - sDate) / 86400000);
                        const p1D = Math.max(1, Math.floor(totalDays * 0.45));
                        const p2D = Math.max(1, Math.floor(totalDays * 0.35));
                        const dayIdx = Math.floor((curr - sDate) / 86400000);

                        ex.subjects.forEach(sub => {
                            if (sub.slides <= 0) return;
                            let phase, remD;
                            if (dayIdx < p1D) { phase = 1; remD = p1D - dayIdx; }
                            else if (dayIdx < p1D + p2D) { phase = 2; remD = (p1D + p2D) - dayIdx; }
                            else { phase = 3; remD = totalDays - dayIdx; }

                            const key = `${dStr}_${ex.id}_${sub.id}_${phase}`;
                            const rec = records[key];
                            
                            let load = remD > 0 ? Math.ceil(left[sub.id][phase] / remD) : 0;
                            if (rebalance.active && dStr <= rebalance.until && ex.id !== rebalance.nearestExamId) load = 0;

                            const amt = rec?.isCustom ? rec.amount : Math.min(load, left[sub.id][phase]);

                            if (rec?.status === 'done' || (!rec?.isCustom && amt > 0) || (rec?.isCustom && (rec.amount > 0 || rec.status === 'missed'))) {
                                tasks.push({ key, exName: ex.name, subName: sub.name, phase, amt, status: rec?.status || 'pending', isCustom: rec?.isCustom });
                                if (rec?.status === 'done' || (!rec?.status && amt > 0)) left[sub.id][phase] -= amt;
                            }
                        });
                    });

                    if (tasks.length > 0) plan.push({ date: new Date(curr), dStr, internalDay: currentInternalDay, tasks });
                    curr.setDate(curr.getDate() + 1);
                }
                return plan;
            }, [exams, records, skipped, rebalance, startDate]);

            const calendarGrid = useMemo(() => {
                if (!startDate) return [];
                const sDate = new Date(startDate + 'T00:00:00');
                const mDate = new Date(Math.max(...exams.map(e => new Date(e.date + 'T00:00:00'))));
                
                const startSun = new Date(sDate);
                startSun.setDate(startSun.getDate() - startSun.getDay());

                const endSat = new Date(mDate);
                if (endSat.getDay() !== 6) endSat.setDate(endSat.getDate() + (6 - endSat.getDay()));

                const grid = [];
                let curr = new Date(startSun);
                const scheduleMap = Object.fromEntries(schedule.map(s => [s.dStr, s]));

                while (curr <= endSat) {
                    const dStr = getLocalISODate(curr);
                    const dailyExams = exams.filter(e => e.date === dStr);
                    const sch = scheduleMap[dStr];
                    
                    grid.push({
                        date: new Date(curr), dStr, dailyExams, isSkipped: skipped.includes(dStr), 
                        totalSlides: sch ? sch.tasks.reduce((acc, t) => acc + t.amt, 0) : 0,
                        isToday: dStr === todayISO, outOfBounds: curr < sDate || curr > mDate,
                        internalDay: sch?.internalDay || null
                    });
                    curr.setDate(curr.getDate() + 1);
                }
                return grid;
            }, [exams, schedule, skipped, todayISO, startDate]);

            const xp = useMemo(() => Object.values(records).reduce((a, b) => b.status === 'done' ? a + b.amount : a, 0), [records]);
            const dashboardStats = useMemo(() => exams.map(exam => {
                let totalP1 = 0, doneP1 = 0;
                exam.subjects.forEach(sub => {
                    totalP1 += sub.slides;
                    Object.keys(records).forEach(key => { if (key.includes(`_${exam.id}_${sub.id}_1`) && records[key].status === 'done') doneP1 += records[key].amount; });
                });
                const diff = Math.ceil((new Date(exam.date + 'T00:00:00') - new Date()) / 86400000);
                return { id: exam.id, name: exam.name, daysLeft: Math.max(0, diff), percent: totalP1 === 0 ? 0 : Math.min(100, Math.round((doneP1 / totalP1) * 100)) };
            }), [exams, records]);

            const weeklyData = useMemo(() => {
                const data = []; const today = new Date(); let maxSlides = 10;
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(today); d.setDate(today.getDate() - i); const dStr = getLocalISODate(d);
                    let count = 0;
                    Object.keys(records).forEach(key => { if (key.startsWith(dStr) && records[key].status === 'done') count += records[key].amount; });
                    if (count > maxSlides) maxSlides = count;
                    data.push({ dateStr: dStr, label: new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(d), count });
                }
                return { data, maxCount: maxSlides };
            }, [records]);


            // ==========================================
            // صفحات خطا و ارتباط با سرور
            // ==========================================

            if (networkError) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 text-rose-800" dir="rtl">
                        <Icons.Warning size={64} className="text-rose-500 mb-6" />
                        <h2 className="text-xl font-black mb-4">خطا در اتصال به سرور</h2>
                        <p className="text-sm text-center mb-6 text-slate-600 leading-relaxed">
                            مرورگر شما امکان برقراری ارتباط با دیتابیس را ندارد.<br/> اگر از محیط‌های بسته (مثل iframe) استفاده می‌کنید، ممکن است به دلایل امنیتی مسدود شده باشد.
                        </p>
                        <button onClick={()=>window.location.reload()} className="px-6 py-3 bg-rose-600 text-white rounded-xl font-bold shadow-lg shadow-rose-500/30">تلاش مجدد</button>
                    </div>
                );
            }

            if (authLoading || (user && !isDbReady)) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900 text-indigo-600 dark:text-indigo-400">
                        <Icons.Sparkles size={40} className="animate-pulse mb-4" />
                        <h2 className="font-bold">در حال اتصال به فضای ابری...</h2>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900">
                        <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl w-full max-w-sm modal-animate">
                            <div className="flex justify-center mb-6 text-indigo-600 dark:text-indigo-400">
                                <Icons.User size={48} />
                            </div>
                            <h2 className="text-2xl font-black text-center mb-8 text-slate-800 dark:text-white">
                                {authMode === 'login' ? 'ورود به حساب' : 'ثبت نام جدید'}
                            </h2>
                            
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">نام کاربری</label>
                                    <input type="text" dir="ltr" placeholder="مثال: ali123" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">رمز عبور</label>
                                    <input type="password" dir="ltr" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                
                                {authError && <div className="bg-rose-100 text-rose-600 p-3 rounded-xl text-xs font-bold text-center animate-bounce">{authError}</div>}
                                
                                <button type="submit" className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold mt-4 shadow-lg shadow-indigo-500/30 transition-all">
                                    {authMode === 'login' ? 'ورود' : 'ثبت نام و ذخیره'}
                                </button>
                            </form>
                            
                            <div className="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                                {authMode === 'login' ? 'حساب کاربری ندارید؟ ' : 'قبلاً ثبت نام کرده‌اید؟ '}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError('');}} className="text-indigo-600 dark:text-indigo-400 font-black">
                                    {authMode === 'login' ? 'ثبت نام کنید' : 'وارد شوید'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // اپلیکیشن اصلی
            // ==========================================
            return (
                <div className="min-h-screen pb-24 dark:text-slate-200">
                    {/* MODAL SYSTEM */}
                    {modal.open && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 modal-animate shadow-2xl">
                                {modal.type === 'add' && (
                                    <>
                                        <h3 className="text-xl font-bold mb-4 dark:text-white">افزودن مبحث</h3>
                                        <input value={val1} onChange={e => setVal1(e.target.value)} placeholder="نام مبحث" className="w-full p-3 mb-3 bg-slate-100 dark:bg-slate-700 rounded-xl dark:text-white outline-none" />
                                        <input type="number" value={val2} onChange={e => setVal2(e.target.value)} placeholder="تعداد اسلاید کل" className="w-full p-3 mb-6 bg-slate-100 dark:bg-slate-700 rounded-xl dark:text-white outline-none" />
                                        <div className="flex gap-2">
                                            <button onClick={() => setModal({ open: false })} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-300">لغو</button>
                                            <button onClick={() => {
                                                const s = parseInt(val2);
                                                if (val1 && !isNaN(s)) {
                                                    setExams(prev => prev.map(ex => ex.id === modal.data.exId ? { ...ex, subjects: [...ex.subjects, { id: 's' + Date.now(), name: val1, slides: s }] } : ex));
                                                    setModal({ open: false });
                                                }
                                            }} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">تایید</button>
                                        </div>
                                    </>
                                )}
                                {modal.type === 'edit' && (
                                    <>
                                        <h3 className="text-xl font-bold mb-2 dark:text-white">تغییر حجم امروز</h3>
                                        <p className="text-xs text-slate-500 mb-4">برای حذف از امروز عدد 0 را بزنید.</p>
                                        <input type="number" value={val1} onChange={e => setVal1(e.target.value)} className="w-full p-4 mb-6 bg-indigo-50 dark:bg-slate-900 rounded-2xl text-center text-3xl font-black text-indigo-600 outline-none" />
                                        <div className="flex gap-2">
                                            <button onClick={() => setModal({ open: false })} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-300">لغو</button>
                                            <button onClick={() => {
                                                const a = parseInt(val1);
                                                if (!isNaN(a)) setTask(modal.data.key, a, 'pending', true);
                                                setModal({ open: false });
                                            }} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">اعمال</button>
                                        </div>
                                    </>
                                )}
                                {modal.type === 'confirm' && (
                                    <>
                                        <h3 className="text-xl font-bold mb-2 text-rose-600">مطمئن هستید؟</h3>
                                        <p className="text-sm text-slate-500 mb-6">{modal.data.msg}</p>
                                        <div className="flex gap-2">
                                            <button onClick={() => setModal({ open: false })} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-300">خیر</button>
                                            <button onClick={() => { modal.data.fn(); setModal({ open: false }); }} className="flex-1 py-3 bg-rose-600 text-white rounded-xl font-bold">بله</button>
                                        </div>
                                    </>
                                )}
                                {modal.type === 'pomodoro_done' && (
                                    <>
                                        <div className="text-center mb-6">
                                            <div className="inline-flex items-center justify-center w-16 h-16 bg-orange-100 dark:bg-orange-900/40 text-orange-600 dark:text-orange-400 rounded-full mb-4">
                                                <Icons.Timer size={32} />
                                            </div>
                                            <h3 className="text-xl font-black mb-2 dark:text-white">خسته نباشید!</h3>
                                            <p className="text-sm text-slate-500 dark:text-slate-400">یک پومودورو (۲۵ دقیقه) به پایان رسید. آیا این مبحث رو انجام دادید؟</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => { stopTimer(); setModal({ open: false }); }} className="flex-1 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-300">بعداً</button>
                                            <button onClick={() => { setTask(modal.data.key, modal.data.amt, 'done'); stopTimer(); setModal({ open: false }); }} className="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-bold">بله، تیک بزن</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <div className="bg-indigo-600 dark:bg-indigo-900 text-white p-6 pt-10 rounded-b-[40px] sticky top-0 z-50 shadow-lg">
                        <div className="max-w-xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black flex items-center gap-2" dir="rtl"><Icons.Flame /> مربی من</h1>
                                <p className="text-[10px] opacity-80 mt-1">ذخیره ابری فعال • {user.email?.split('@')[0]}</p>
                            </div>
                            <button onClick={() => { triggerHaptic(); setDark(!dark); }} className="p-3 bg-white/10 rounded-full">
                                {dark ? <Icons.Sun /> : <Icons.Moon />}
                            </button>
                        </div>
                    </div>

                    <div className="max-w-xl mx-auto p-4 space-y-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 fade-in">
                                <div className="bg-gradient-to-br from-orange-400 to-rose-500 p-6 rounded-[32px] text-white shadow-xl flex items-center justify-between">
                                    <div><p className="text-xs font-bold opacity-75 mb-1">مجموع امتیاز (XP)</p><h2 className="text-4xl font-black">{xp}</h2></div>
                                    <Icons.Flame />
                                </div>

                                <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl border dark:border-slate-700 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold dark:text-white flex items-center gap-2"><Icons.Chart /> پیشرفت ۷ روز گذشته</h3>
                                        <span className="text-xs text-slate-400">اسلاید خوانده شده</span>
                                    </div>
                                    <div className="flex items-end justify-between h-40 gap-2 px-1">
                                        {weeklyData.data.map((day, idx) => (
                                            <div key={day.dateStr} className="flex flex-col items-center flex-1 h-full justify-end group">
                                                <span className={`text-[10px] font-bold mb-1 transition-opacity ${day.count > 0 ? 'text-indigo-600 dark:text-indigo-400' : 'text-transparent'}`}>{day.count}</span>
                                                <div className="w-full max-w-[28px] bg-slate-100 dark:bg-slate-700 rounded-t-lg relative flex items-end overflow-hidden" style={{ height: '100px' }}>
                                                    <div className={`w-full rounded-t-lg transition-all duration-700 ease-out ${day.dateStr === todayISO ? 'bg-orange-400' : 'bg-indigo-500 dark:bg-indigo-600'}`} style={{ height: `${(day.count / weeklyData.maxCount) * 100}%` }}></div>
                                                </div>
                                                <span dir="ltr" className={`text-[9px] mt-2 font-bold ${day.dateStr === todayISO ? 'text-orange-500' : 'text-slate-500 dark:text-slate-400'}`}>{idx === 6 ? 'Today' : day.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <h2 className="text-xl font-black pr-3 border-r-4 border-indigo-500 dark:text-white">وضعیت امتحانات</h2>
                                <div className="grid grid-cols-1 gap-4">
                                    {dashboardStats.map(s => (
                                        <div key={s.id} className="bg-white dark:bg-slate-800 p-5 rounded-3xl border dark:border-slate-700 shadow-sm">
                                            <div className="flex justify-between mb-4"><h3 className="font-bold dark:text-white">{s.name}</h3><span className="text-[10px] bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 px-2 py-1 rounded-lg font-black">{s.daysLeft} روز</span></div>
                                            <div className="flex justify-between text-[10px] mb-1 font-bold opacity-60 dark:text-slate-400"><span>پیشرفت دور اول</span><span>{s.percent}%</span></div>
                                            <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                                <div className="bg-indigo-500 h-full progress-bar-stripes transition-all duration-1000" style={{width: `${s.percent}%`}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'planner' && (
                            <div className="space-y-6 fade-in">
                                {!startDate && (
                                     <div className="text-center py-10">
                                         <p className="text-slate-500 dark:text-slate-400 mb-4">برای مشاهده برنامه‌ریزی، ابتدا از بخش تنظیمات تاریخ شروع مطالعه را تعیین کنید.</p>
                                     </div>
                                )}

                                {startDate && schedule.map(day => (
                                    <div key={day.dStr} className={`bg-white dark:bg-slate-800 rounded-3xl border dark:border-slate-700 overflow-hidden shadow-sm ${day.dStr === todayISO ? 'ring-2 ring-indigo-500' : ''}`}>
                                        <div className="bg-slate-50 dark:bg-slate-900/50 p-4 border-b dark:border-slate-700 flex justify-between items-center">
                                            <div className="flex items-center gap-2">
                                                <h4 dir="ltr" className="font-black text-sm dark:text-white tracking-wide">{formatDate(day.date)}</h4>
                                                <span className="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 text-[10px] px-2 py-0.5 rounded-md font-bold">روز {day.internalDay}</span>
                                            </div>
                                            <button onClick={() => setModal({open:true, type:'confirm', data:{msg:'آیا امروز استراحت می‌کنید؟', fn:()=>setSkipped(p=>[...p, day.dStr])}})} className="p-2 text-rose-500"><Icons.Skip /></button>
                                        </div>
                                        <div className="p-4 space-y-3">
                                            {day.tasks.length === 0 && <div className="text-center py-4 text-slate-400 dark:text-slate-500 text-sm font-bold">برنامه‌ای برای امروز نیست</div>}
                                            {day.tasks.map(t => (
                                                <div key={t.key} className={`p-4 rounded-2xl border-2 flex flex-col gap-3 ${t.status === 'done' ? 'bg-emerald-50 border-emerald-100 dark:bg-emerald-900/10 dark:border-emerald-900/30' : 'bg-slate-50 border-slate-100 dark:bg-slate-900/40 dark:border-slate-700'} ${activeTimer.key === t.key && activeTimer.isRunning ? 'border-orange-400 bg-orange-50 dark:bg-orange-900/10 shadow-md' : ''}`}>
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <h5 className={`font-bold text-xs dark:text-white ${t.status === 'done' && 'line-through opacity-50'}`}>{t.subName}</h5>
                                                            <p className="text-[10px] opacity-50 dark:text-slate-400 mt-1">{t.exName} • فاز {t.phase}</p>
                                                        </div>
                                                        <div className="flex items-center gap-1 bg-white dark:bg-slate-800 px-2 py-1 rounded-lg border dark:border-slate-700 shadow-sm">
                                                            <span className="text-xs font-black text-indigo-600 dark:text-indigo-400">{t.amt}</span><span className="text-[9px]">اسلاید</span>
                                                            {t.status === 'pending' && <button onClick={() => {setVal1(t.amt); setModal({open:true, type:'edit', data:{key:t.key}});}} className="mr-1 opacity-30 dark:text-white"><Icons.Edit /></button>}
                                                        </div>
                                                    </div>
                                                    {t.status === 'pending' ? (

                                                            <button onClick={() => toggleTimer(t)} className={`flex items-center justify-center gap-1 flex-1 py-2 rounded-xl text-[11px] font-bold transition-colors ${activeTimer.key === t.key ? (activeTimer.isRunning ? 'bg-orange-100 text-orange-600 dark:bg-orange-900/40 dark:text-orange-400' : 'bg-orange-500 text-white') : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                                                {activeTimer.key === t.key ? (activeTimer.isRunning ? <Icons.Pause size={12} /> : <Icons.Play size={12} />) : <Icons.Timer size={12} />}
                                                                <span dir="ltr" className="tracking-widest">{activeTimer.key === t.key ? formatTime(activeTimer.timeLeft) : '۲۵:۰۰'}</span>
                                                            </button>
                                                            {activeTimer.key === t.key && (
                                                                <button onClick={stopTimer} className="py-2 px-3 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl flex items-center justify-center transition-colors hover:bg-slate-300 dark:hover:bg-slate-600">
                                                                    <Icons.Stop size={12} />
                                                                </button>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <div className="flex justify-between items-center pt-2 border-t dark:border-slate-700"><span className={`text-[9px] font-bold ${t.status === 'done' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>{t.status === 'done' ? 'تکمیل شد' : 'نخوانده ماند'}</span><button onClick={() => undoTask(t.key)} className="text-indigo-600 dark:text-indigo-400"><Icons.Undo /></button></div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                        {activeTab === 'calendar' && (
                            <div className="space-y-6 fade-in">

                                    <h2 className="text-lg font-black dark:text-white mb-2 flex items-center gap-2"><Icons.Calendar /> نقشه راه تا امتحانات</h2>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">یک نمای کلی از حجم مطالعه در کل مسیر برنامه‌ریزی شده.</p>
                                    
                                    {!startDate ? (
                                        <div className="text-center py-6 text-slate-400 font-bold text-sm">تاریخ شروع مشخص نشده است.</div>
                                    ) : (
                                        <>
                                            <div className="grid grid-cols-7 gap-1.5 mb-2 text-center text-[10px] font-bold text-slate-400 dark:text-slate-500" dir="ltr">
                                                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                                            </div>
                                            
                                            <div className="grid grid-cols-7 gap-1.5" dir="ltr">
                                                {calendarGrid.map((day, idx) => {
                                                    let bgClass = "bg-slate-50 dark:bg-slate-900/40 text-slate-400";
                                                    if (day.outOfBounds) bgClass = "bg-transparent text-slate-300 dark:text-slate-700 opacity-30";
                                                    else if (day.isSkipped) bgClass = "skipped-pattern text-slate-400 border border-slate-200 dark:border-slate-700";
                                                    else if (day.dailyExams.length > 0) bgClass = "bg-rose-500 text-white shadow-md shadow-rose-500/30";
                                                    else if (day.totalSlides > 150) bgClass = "bg-orange-500 text-white shadow-sm shadow-orange-500/20";
                                                    else if (day.totalSlides > 50) bgClass = "bg-indigo-500 text-white";
                                                    else if (day.totalSlides > 0) bgClass = "bg-indigo-100 dark:bg-indigo-900/60 text-indigo-800 dark:text-indigo-300";

                                                    const isSelected = selectedCalDate === day.dStr;

                                                    return (
                                                        <button key={idx} onClick={() => { triggerHaptic(); setSelectedCalDate(day.dStr); }} className={`aspect-square rounded-xl flex flex-col items-center justify-center relative transition-all duration-200 ${bgClass} ${isSelected && !day.outOfBounds ? 'ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-800 ring-indigo-600 dark:ring-indigo-400 scale-110 z-10' : 'hover:scale-105'}`} disabled={day.outOfBounds}>
                                                            <span className="text-xs font-bold font-mono">{day.date.getDate()}</span>
                                                            {day.isToday && <span className="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-current opacity-70"></span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6 fade-in">
                                
                                <div className="bg-rose-50 dark:bg-slate-800 rounded-3xl border border-rose-100 dark:border-slate-700 p-4 shadow-sm flex justify-between items-center">
                                    <div>
                                        <h4 className="font-bold text-sm text-rose-900 dark:text-white flex items-center gap-2"><Icons.User size={16}/> حساب کاربری</h4>
                                        <p className="text-[10px] text-rose-500 dark:text-slate-400 mt-1">{user.email?.split('@')[0]}</p>
                                    </div>
                                    <button onClick={handleLogout} className="bg-rose-600 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2">
                                        خروج <Icons.LogOut />
                                    </button>
                                </div>

                                <h3 className="text-sm font-black dark:text-white mt-8 mb-2 px-2">تنظیمات اصلی و امتحانات</h3>
                                
                                <div className="bg-indigo-50 dark:bg-slate-800 rounded-3xl border border-indigo-100 dark:border-slate-700 p-4 shadow-sm flex justify-between items-center">
                                    <div>
                                        <h4 className="font-bold text-sm text-indigo-900 dark:text-white">تاریخ شروع مطالعه</h4>
                                    </div>
                                    <input 
                                        type="date" 
                                        value={startDate} 
                                        onChange={(e) => setStartDate(e.target.value)}
                                        style={{colorScheme: dark ? 'dark' : 'light'}}
                                        className="bg-white dark:bg-slate-900 border border-indigo-200 dark:border-slate-600 rounded-xl text-xs font-bold text-indigo-700 dark:text-white p-2 outline-none"
                                    />
                                </div>

                                {exams.map(ex => (
                                    <div key={ex.id} className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">

                                            <h4 className="font-bold text-sm dark:text-white flex items-center gap-2">
                                                {ex.name} 
                                                <span dir="ltr" className="text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-1.5 py-0.5 rounded-md">
                                                    {formatDate(new Date(ex.date))}
                                                </span>
                                            </h4>
                                            <button onClick={() => {setVal1(''); setVal2(''); setModal({open:true, type:'add', data:{exId:ex.id}});}} className="bg-indigo-600 text-white p-1.5 rounded-lg"><Icons.Plus /></button>
                                        </div>
                                        <div className="p-2 space-y-1">
                                            {ex.subjects.map(s => (
                                                <div key={s.id} className="flex justify-between items-center p-3 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-2xl">
                                                    <span className="text-[11px] dark:text-white truncate pr-2">{s.name}</span>
                                                    <div className="flex items-center gap-2"><input type="number" value={s.slides} onChange={e => handleUpdateSlide(ex.id, s.id, e.target.value)} className="w-14 bg-slate-100 dark:bg-slate-900 border-none rounded-lg text-center text-xs font-bold text-indigo-600 dark:text-indigo-400 p-1 outline-none" /><button onClick={() => setExams(p => p.map(e => e.id===ex.id ? {...e, subjects:e.subjects.filter(x=>x.id!==s.id)} : e))} className="text-rose-400"><Icons.Trash /></button></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 glass-nav bg-white/80 dark:bg-slate-900/80 border-t dark:border-slate-800 p-4 pb-8 flex justify-around">
                        <button onClick={() => {triggerHaptic(); setActiveTab('dashboard');}} className={activeTab === 'dashboard' ? 'text-indigo-600 scale-110' : 'text-slate-400'}><Icons.Dashboard /></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('planner');}} className={activeTab === 'planner' ? 'text-indigo-600 scale-110' : 'text-slate-400'}><Icons.Planner /></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('calendar');}} className={activeTab === 'calendar' ? 'text-indigo-600 scale-110' : 'text-slate-400'}><Icons.Calendar /></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('settings');}} className={activeTab === 'settings' ? 'text-indigo-600 scale-110' : 'text-slate-400'}><Icons.Settings /></button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
