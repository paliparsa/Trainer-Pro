                if (type === 'none') { stopFocusSound(); return; }
                if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                stopFocusSound(); 
                
                const bufferSize = audioCtxRef.current.sampleRate * 2; 
                const buffer = audioCtxRef.current.createBuffer(1, bufferSize, audioCtxRef.current.sampleRate);
                const data = buffer.getChannelData(0);
                
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02; // Brown noise approximation
                    lastOut = data[i];
                    data[i] *= 3.5; 
                }
                
                noiseNodeRef.current = audioCtxRef.current.createBufferSource();
                noiseNodeRef.current.buffer = buffer;
                noiseNodeRef.current.loop = true;
                
                const filter = audioCtxRef.current.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = type === 'rain' ? 400 : 1200; // Rain vs Cafe hum
                
                const gain = audioCtxRef.current.createGain();

                noiseNodeRef.current.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtxRef.current.destination);
                noiseNodeRef.current.start();

                setExams(prev => prev.map(ex => ex.id === exId ? { ...ex, subjects: ex.subjects.map(s => s.id === subId ? { ...s, slides: parseInt(slides) || 0 } : s) } : ex));
            };

            const handleVacation = () => {
                const days = parseInt(val1);
                if(isNaN(days) || days <= 0) return setModalError('تعداد روز نامعتبر است');
                
                const newExams = exams.map(ex => {
                    if (ex.archived || !ex.date) return ex;
                    const d = new Date(ex.date);
                    d.setDate(d.getDate() + days);
                    return { ...ex, date: getLocalISODate(d) };
                });
                setExams(newExams);
                setModal({open: false});
                setVal1('');
                alert(`مرخصی اعمال شد. تمام ددلاین‌ها ${days} روز تمدید شدند.`);
            };

            // Social & Sharing Functions
            const handleSharePlan = async (exam) => {
                triggerHaptic();
                const shareCode = 'PLN-' + Math.random().toString(36).substring(2, 7).toUpperCase();
                try {
                    const { doc, setDoc } = window.FirebaseAPI;
                    await setDoc(doc(window.db, 'shared_plans', shareCode), {
                        name: exam.name, subjects: exam.subjects, authorName: profile.name, createdAt: new Date().toISOString()
                    });
                    setModal({ open: true, type: 'share_success', data: { shareCode, name: exam.name } });
                } catch(e) { alert("خطا در اشتراک گذاری"); }
            };

            const handleImportPlan = async () => {
                setModalError('');
                const code = val1.trim().toUpperCase();
                if(!code) return setModalError('کد را وارد کنید');
                try {
                    const { doc, getDoc } = window.FirebaseAPI;
                    const docSnap = await getDoc(doc(window.db, 'shared_plans', code));
                    if (docSnap.exists()) {
                        const planData = docSnap.data();
                        const newExam = {
                            id: 'e' + Date.now(),
                            name: planData.name + ' (کپی)',
                            date: '', archived: false,
                            subjects: planData.subjects.map(s => ({ ...s, id: 's' + Math.random().toString(36).substring(2,8) }))
                        };
                        setExams(prev => [...prev, newExam]);
                        setModal({ open: false }); setVal1('');
                    } else setModalError('برنامه‌ای با این کد یافت نشد!');
                } catch(e) { setModalError('خطا در ارتباط با سرور'); }
            };

            const handleAddFriend = async () => {
                setModalError('');
                const code = val1.trim().toUpperCase();
                if(!code) return setModalError('کد را وارد کنید');
                if(code === profile.friendCode) return setModalError('نمی‌توانید خودتان را ادد کنید!');
                
                try {
                    const { doc, getDoc } = window.FirebaseAPI;
                    const docSnap = await getDoc(doc(window.db, 'friend_codes', code));
                    if (docSnap.exists()) {
                        const friendUid = docSnap.data().uid;
                        if(profile.friends.includes(friendUid)) return setModalError('قبلاً ادد شده است.');
                        setProfile(p => ({...p, friends: [...p.friends, friendUid]}));
                        setModal({ open: false }); setVal1('');
                    } else setModalError('کد نامعتبر است!');
                } catch(e) { setModalError('خطا در یافتن دوست'); }
            };

            // Submit Wizard Form cleanly
            const submitWizard = async () => {
                triggerHaptic(); 
                let finalSubs = [...wizSubjects];
                if (wizSubName && wizSubAmt) {
                    const amt = parseInt(wizSubAmt);
                    if (!isNaN(amt)) finalSubs.push({ id: 's'+Date.now(), name: wizSubName, slides: amt });
                }
                const finalExam = { id: 'e' + Date.now(), name: wizGoalName, date: wizGoalDate, subjects: finalSubs, archived: false }; 
                setExams([finalExam]);
                setHasSeenOnboarding(true);
                
                // Force a DB save so it doesn't get lost before reload
                if (window.FirebaseAPI && window.db) {
                    try {
                        await window.FirebaseAPI.setDoc(window.FirebaseAPI.doc(window.db, 'users', user.uid, 'data', 'general_planner_v5'), {
                            startDate, exams: [finalExam], records, skipped, missedStreak, rebalance, dark, hasSeenOnboarding: true, badges, pomodorosCompleted, pomodoroDuration, themeColor, streak, brainDump,
                            lastUpdated: new Date().toISOString()
                        }, { merge: true });
                    } catch(e) {}
                }
                setActiveTab('dashboard');
            };

            // محاسبات زمان‌بندی
            const schedule = useMemo(() => {
                if (!startDate || exams.length === 0) return []; 
                const plan = [];
                const left = {};
                exams.forEach(ex => ex.subjects.forEach(s => left[s.id] = { 1: s.slides, 2: s.slides, 3: s.slides }));

                const sDate = new Date(startDate + 'T00:00:00');
                const validExams = exams.filter(e => e.date && !e.archived);
                if(validExams.length === 0) return [];

                const mDate = new Date(Math.max(...validExams.map(e => new Date(e.date + 'T00:00:00'))));
                let curr = new Date(sDate);
                let absoluteDayCount = 1;

                while (curr < mDate) {
                    const dStr = getLocalISODate(curr);
                    const currentInternalDay = absoluteDayCount;
                    absoluteDayCount++;

                    if (skipped.includes(dStr)) { curr.setDate(curr.getDate() + 1); continue; }

                    const tasks = [];
                    validExams.forEach(ex => {
                        const exDate = new Date(ex.date + 'T00:00:00');
                        if (curr >= exDate) return;

                        const totalDays = Math.ceil((exDate - sDate) / 86400000);
                        if(totalDays <= 0) return;

                        const p1D = Math.max(1, Math.floor(totalDays * 0.45));
                        const p2D = Math.max(1, Math.floor(totalDays * 0.35));
                        const dayIdx = Math.floor((curr - sDate) / 86400000);

                        ex.subjects.forEach(sub => {
                            if (sub.slides <= 0) return;
                            let phase, remD;
                            if (dayIdx < p1D) { phase = 1; remD = p1D - dayIdx; }
                            else if (dayIdx < p1D + p2D) { phase = 2; remD = (p1D + p2D) - dayIdx; }
                            else { phase = 3; remD = totalDays - dayIdx; }

                            const key = `${dStr}_${ex.id}_${sub.id}_${phase}`;
                            const rec = records[key];
                            
                            let load = remD > 0 ? Math.ceil(left[sub.id][phase] / remD) : 0;
                            if (rebalance.active && dStr <= rebalance.until && ex.id !== rebalance.nearestExamId) load = 0;

                            const amt = rec?.isCustom ? rec.amount : Math.min(load, left[sub.id][phase]);

                            if (rec?.status === 'done' || rec?.status === 'skipped' || (!rec?.isCustom && amt > 0) || (rec?.isCustom && (rec.amount > 0 || rec.status === 'missed'))) {
                                tasks.push({ key, exName: ex.name, subName: sub.name, phase, amt, status: rec?.status || 'pending', isCustom: rec?.isCustom, note: rec?.note });
                                if (rec?.status === 'done' || (!rec?.status && amt > 0)) left[sub.id][phase] -= amt;
                            }
                        });
                    });

                    if (tasks.length > 0) plan.push({ date: new Date(curr), dStr, internalDay: currentInternalDay, tasks });
                    curr.setDate(curr.getDate() + 1);
                }
                return plan;
            }, [exams, records, skipped, rebalance, startDate]);

            // تولید تقویم
            const calendarGrid = useMemo(() => {
                if (!startDate || exams.length === 0) return [];
                const sDate = new Date(startDate + 'T00:00:00');
                const validExams = exams.filter(e => e.date && !e.archived);
                if(validExams.length === 0) return [];
                
                const mDate = new Date(Math.max(...validExams.map(e => new Date(e.date + 'T00:00:00'))));
                
                const startSun = new Date(sDate);
                startSun.setDate(startSun.getDate() - startSun.getDay());

                const endSat = new Date(mDate);
                if (endSat.getDay() !== 6) endSat.setDate(endSat.getDate() + (6 - endSat.getDay()));

                const grid = [];
                let curr = new Date(startSun);
                const scheduleMap = Object.fromEntries(schedule.map(s => [s.dStr, s]));

                while (curr <= endSat) {
                    const dStr = getLocalISODate(curr);
                    const dailyExams = validExams.filter(e => e.date === dStr);
                    const sch = scheduleMap[dStr];
                    const totalSlides = sch ? sch.tasks.reduce((acc, t) => acc + (t.status !== 'skipped' ? t.amt : 0), 0) : 0;
                    
                    grid.push({
                        date: new Date(curr), dStr, dailyExams, isSkipped: skipped.includes(dStr), 
                        totalSlides, isToday: dStr === todayISO, outOfBounds: curr < sDate || curr > mDate,
                        internalDay: sch?.internalDay || null
                    });
                    curr.setDate(curr.getDate() + 1);
                }
                return grid;
            }, [exams, schedule, skipped, todayISO, startDate]);

            const dashboardStats = useMemo(() => exams.filter(e=>!e.archived).map(exam => {
                let totalP1 = 0, doneP1 = 0;
                exam.subjects.forEach(sub => {
                    totalP1 += sub.slides;
                    Object.keys(records).forEach(key => { if (key.includes(`_${exam.id}_${sub.id}_1`) && records[key].status === 'done') doneP1 += records[key].amount; });
                });
                const diff = exam.date ? Math.ceil((new Date(exam.date + 'T00:00:00') - new Date()) / 86400000) : 0;
                return { id: exam.id, name: exam.name, daysLeft: Math.max(0, diff), percent: totalP1 === 0 ? 0 : Math.min(100, Math.round((doneP1 / totalP1) * 100)) };
            }), [exams, records]);

            const weeklyData = useMemo(() => {
                const data = []; const today = new Date(); let maxSlides = 10;
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(today); d.setDate(today.getDate() - i); const dStr = getLocalISODate(d);
                    let count = 0;
                    Object.keys(records).forEach(key => { if (key.startsWith(dStr) && records[key].status === 'done') count += records[key].amount; });
                    if (count > maxSlides) maxSlides = count;
                    data.push({ dateStr: dStr, label: new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(d), count });
                }
                return { data, maxCount: maxSlides };
            }, [records]);


            // ==========================================
            // صفحات وضعیت
            // ==========================================
            if (networkError) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 text-rose-800" dir="rtl">
                        <Icons.Warning size={64} className="text-rose-500 mb-6" />
                        <h2 className="text-xl font-black mb-4 text-center">خطا در ارتباط با سرور</h2>
                        <div className="bg-rose-100 p-4 rounded-xl text-sm mb-6 text-rose-900 border border-rose-200 w-full" dir="ltr" style={{wordBreak: 'break-all'}}>
                            <b>Error Details:</b><br/>{detailedError}
                        </div>
                        <button onClick={()=>window.location.reload()} className="px-6 py-3 bg-rose-600 text-white rounded-xl font-bold shadow-lg shadow-rose-500/30">تلاش مجدد</button>
                    </div>
                );
            }

            if (authLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900 text-primary-600 dark:text-primary-400">
                        <div className="w-10 h-10 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mb-4"></div>
                        <h2 className="font-bold">در حال برقراری ارتباط...</h2>
                    </div>
                );
            }

            // ==========================================
            // صفحه خوش‌آمدگویی قبل از لاگین
            // ==========================================
            if (!user) {
                if (!showAuthForm) {
                    return (
                        <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                            <div className="absolute top-[-10%] left-[-10%] w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-rose-500/20 rounded-full blur-3xl"></div>
                            
                            <div className="w-full max-w-sm space-y-8 text-center z-10 fade-in">
                                <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-indigo-500/40">
                                    <Icons.Flame size={48} className="text-white" />
                                </div>
                                
                                <div>
                                    <h1 className="text-3xl font-black text-slate-800 dark:text-white mb-3">مربی پرو</h1>
                                    <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed px-4">
                                        برنامه‌ریز هوشمند، همراه با لیگ رقابتی، سیستم مدال‌ها و مرور منظم برای اهداف شما.
                                    </p>
                                </div>

                                <div className="space-y-4 text-right bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-white dark:border-slate-700">
                                    <div className="flex items-start gap-4">
                                        <div className="p-2.5 bg-orange-100 text-orange-600 dark:bg-orange-900/40 dark:text-orange-400 rounded-xl"><Icons.Trophy /></div>
                                        <div><h3 className="font-bold text-sm dark:text-white">لیگ و پروفایل</h3><p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">ساخت پروفایل، ادد کردن دوستان و رقابت</p></div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2.5 bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400 rounded-xl"><Icons.Planner size={20}/></div>
                                        <div><h3 className="font-bold text-sm dark:text-white">برنامه‌ریزی و تمرکز</h3><p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">تقسیم هوشمند کارها و تایمر با صدای باران</p></div>
                                    </div>
                                </div>

                                <button onClick={() => setShowAuthForm(true)} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold shadow-lg shadow-indigo-500/30 transition-all transform hover:scale-[1.02]">
                                    شروع کنید (ورود / ثبت‌نام)
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900">
                        <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl w-full max-w-sm modal-animate relative">
                            <button onClick={() => setShowAuthForm(false)} className="absolute top-4 left-4 p-2 text-slate-400 hover:text-slate-600"><Icons.Undo /></button>
                            <div className="flex justify-center mb-6 text-indigo-600 dark:text-indigo-400 mt-2">
                                <Icons.User size={48} />
                            </div>
                            <h2 className="text-2xl font-black text-center mb-8 text-slate-800 dark:text-white">
                                {authMode === 'login' ? 'ورود به حساب' : 'ثبت نام جدید'}
                            </h2>
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">نام کاربری</label>
                                    <input type="text" dir="ltr" placeholder="مثال: ali123" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">رمز عبور (حداقل ۶ حرف)</label>
                                    <input type="password" dir="ltr" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                
                                {authError && <div className="bg-rose-100 text-rose-600 p-3 rounded-xl text-xs font-bold text-center animate-bounce leading-relaxed">{authError}</div>}
                                
                                <button type="submit" className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold mt-4 shadow-lg shadow-indigo-500/30 transition-all">
                                    {authMode === 'login' ? 'ورود به برنامه' : 'ثبت نام و ساخت حساب'}
                                </button>

                                <div className="relative my-6">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200 dark:border-slate-700"></div></div>
                                    <div className="relative flex justify-center text-xs"><span className="bg-white dark:bg-slate-800 px-3 text-slate-400 font-bold">یا</span></div>
                                </div>

                                <button type="button" onClick={handleGoogleLogin} className="w-full py-4 bg-white dark:bg-slate-700 border-2 border-slate-100 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-white rounded-2xl font-bold shadow-sm transition-all flex items-center justify-center gap-3">
                                    <Icons.Google /> ورود با حساب گوگل
                                </button>

                            </form>
                            <div className="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                                {authMode === 'login' ? 'حساب کاربری ندارید؟ ' : 'قبلاً حساب ساخته‌اید؟ '}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError('');}} className="text-indigo-600 dark:text-indigo-400 font-black">
                                    {authMode === 'login' ? 'ثبت نام کنید' : 'وارد شوید'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // ویزارد راه‌اندازی (کاربر جدید)
            // ==========================================
            if (user && isDbReady && !hasSeenOnboarding) {
                return (
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                        <div className="absolute top-[-10%] right-[-10%] w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>

                        <div className="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden z-10 border border-slate-100 dark:border-slate-700 relative">
                            <div className="flex h-2 bg-slate-100 dark:bg-slate-700">
                                <div className={`bg-indigo-600 transition-all duration-500 h-full ${wizardStep === 1 ? 'w-1/3' : wizardStep === 2 ? 'w-2/3' : 'w-full'}`}></div>
                            </div>

                            <div className="p-6 pb-2 text-center">
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-1">راه‌اندازی پروفایل</h2>
                                <p className="text-xs text-slate-500 dark:text-slate-400">
                                    {wizardStep === 1 && "قدم اول: زمان‌بندی"}
                                    {wizardStep === 2 && "قدم دوم: تعریف هدف اصلی"}
                                    {wizardStep === 3 && "قدم نهایی: ساختار پروژه"}
                                </p>
                            </div>

                            <div className="p-6 pt-4">
                                {wizardStep === 1 && (
                                    <div className="space-y-6 fade-in">
                                        <div className="w-20 h-20 bg-indigo-50 dark:bg-indigo-900/30 rounded-full flex items-center justify-center mx-auto text-indigo-600 dark:text-indigo-400 mb-6">
                                            <Icons.Calendar size={32} />
                                        </div>
                                        <div className="text-center mb-6">
                                            <p className="text-sm text-slate-600 dark:text-slate-300 font-bold mb-4 leading-relaxed">
                                                برای شروع، از چه تاریخی می‌خواهید برنامه‌ریزی شما آغاز شود؟
                                            </p>
                                            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} style={{colorScheme: dark ? 'dark' : 'light'}} className="w-full p-4 bg-slate-100 dark:bg-slate-900 border border-indigo-200 dark:border-slate-600 rounded-2xl text-sm font-bold text-center text-indigo-700 dark:text-white outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                        <button onClick={() => { if(startDate) setWizardStep(2); else alert('لطفا یک تاریخ انتخاب کنید.'); }} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-colors">تایید و ادامه</button>
                                        
                                        <button onClick={() => { setHasSeenOnboarding(true); setActiveTab('settings'); }} className="w-full py-2 text-indigo-600 dark:text-indigo-400 text-xs font-bold mt-2">بعداً تنظیم می‌کنم</button>
                                    </div>
                                )}

                                {wizardStep === 2 && (
                                    <div className="space-y-6 fade-in">
                                        <div className="w-20 h-20 bg-rose-50 dark:bg-rose-900/30 rounded-full flex items-center justify-center mx-auto text-rose-600 dark:text-rose-400 mb-6">
                                            <Icons.Flame size={32} />
                                        </div>
                                        <div className="space-y-4 mb-6">
                                            <p className="text-sm text-slate-600 dark:text-slate-300 font-bold text-center leading-relaxed mb-4">اولین هدف بزرگ یا آزمونی که برای آن آماده می‌شوید چیست؟</p>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1 px-1">نام هدف (مثل: کنکور، آیلتس...)</label>
                                                <input value={wizGoalName} onChange={e=>setWizGoalName(e.target.value)} placeholder="مثال: آزمون آیلتس" className="w-full p-4 bg-slate-100 dark:bg-slate-900 border-none rounded-2xl text-sm font-bold dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1 px-1">تاریخ رسیدن به هدف / ددلاین</label>
                                                <input type="date" value={wizGoalDate} onChange={e=>setWizGoalDate(e.target.value)} style={{colorScheme: dark ? 'dark' : 'light'}} className="w-full p-4 bg-slate-100 dark:bg-slate-900 border-none rounded-2xl text-sm font-bold text-center dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setWizardStep(1)} className="py-4 px-6 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-2xl font-bold hover:bg-slate-300 transition-colors">بازگشت</button>
                                            <button onClick={() => { if(wizGoalName && wizGoalDate) setWizardStep(3); else alert('لطفا نام و تاریخ را پر کنید.'); }} className="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-colors">تایید و ادامه</button>
                                        </div>
                                    </div>
                                )}

                                                        </div>

                                                </div>

                        {activeTab === 'calendar' && (

                                    <Icons.LogOut /> خروج از حساب کاربری
                                </button>
                            </div>

                    </div>

                    <div className="fixed bottom-0 left-0 right-0 glass-nav bg-white/90 dark:bg-slate-900/90 border-t dark:border-slate-800 p-3 pb-8 flex justify-around items-center">

                        <button onClick={() => {triggerHaptic(); setActiveTab('calendar');}} className={`transition-all duration-300 flex flex-col items-center gap-1 ${activeTab === 'calendar' ? 'text-primary-600 dark:text-primary-400 scale-110' : 'text-slate-400 dark:text-slate-500'}`}><Icons.Calendar /> <span className="text-[9px] font-bold">تقویم</span></button>
