                    if (navigator.vibrate) navigator.vibrate([100, 100, 100, 100, 300]);
                    setActiveTimer(prev => ({ ...prev, isRunning: false }));
                    setModal({ open: true, type: 'pomodoro_done', data: { key: activeTimer.key, amt: activeTimer.amt } });
                }
                return () => clearInterval(interval);
            }, [activeTimer.isRunning, activeTimer.timeLeft]);

            // === Helpers ===
            const triggerHaptic = () => { if (navigator.vibrate) navigator.vibrate(50); };
            const formatDate = (date) => new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).format(date);
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleAuthSubmit = async (e) => {
                e.preventDefault(); setAuthError('');
                if (username.length < 3) return setAuthError('نام کاربری حداقل ۳ حرف');
                if (password.length < 6) return setAuthError('رمز عبور حداقل ۶ حرف');

                const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.FirebaseAPI;
                const email = username.trim().toLowerCase() + "@planner.local"; 

                try {
                    if (authMode === 'login') await signInWithEmailAndPassword(window.auth, email, password);
                    else await createUserWithEmailAndPassword(window.auth, email, password);
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') setAuthError('این نام کاربری قبلاً ثبت شده!');
                    else if (err.code === 'auth/invalid-credential') setAuthError('نام کاربری یا رمز عبور اشتباه است!');
                    else setAuthError('خطای ورود: ' + err.message);
                }
            };

            const handleGoogleLogin = async () => {
                triggerHaptic();
                setAuthError('');
                try {
                    const { GoogleAuthProvider, signInWithPopup } = window.FirebaseAPI;
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(window.auth, provider);
                } catch (err) {
                    console.error("Google Auth Error:", err);
                    if (err.code === 'auth/popup-closed-by-user') {
                    } else if (err.code === 'auth/operation-not-allowed') {
                        setAuthError('ورود با حساب گوگل در پنل فایربیس شما غیرفعال است! آن را روشن کنید.');
                    } else {
                        setAuthError('خطا در ارتباط با گوگل: ' + err.message);
                    }
                }
            };

            const handleLogout = async () => {
                triggerHaptic();
                await window.FirebaseAPI.signOut(window.auth);
                setIsDbReady(false);
                setShowAuthForm(false);
                setActiveTab('planner');
                
                setStartDate('');
                setExams([]); 
                setRecords({});
                setSkipped([]);
                setMissedStreak(0);
                setRebalance({ active: false, until: null, nearestExamId: null });
                setHasSeenOnboarding(false);
                setUsername('');
                setPassword('');
            };

            const toggleTimer = (t) => {
                triggerHaptic();
                if (activeTimer.key === t.key) setActiveTimer(prev => ({ ...prev, isRunning: !prev.isRunning }));
                else setActiveTimer({ key: t.key, timeLeft: POMODORO_TIME, isRunning: true, amt: t.amt });
            };

            const stopTimer = () => { triggerHaptic(); setActiveTimer({ key: null, timeLeft: POMODORO_TIME, isRunning: false, amt: 0 }); };

            const setTask = (key, amt, stat, custom = false) => {
                triggerHaptic();
                setRecords(prev => ({ ...prev, [key]: { amount: amt, status: stat, isCustom: custom } }));
                if (activeTimer.key === key) stopTimer();

                if (stat === 'missed') {
                    const newStreak = missedStreak + 1;
                    setMissedStreak(newStreak);
                    if (newStreak >= 3) {
                        const sortedExams = [...exams].filter(e=>e.date).sort((a, b) => new Date(a.date) - new Date(b.date));
                        if (sortedExams.length > 0) setModal({ open: true, type: 'rebalance', data: { nearest: sortedExams[0] } });
                        setMissedStreak(0);
                    }
                } else if (stat === 'done') {
                    setMissedStreak(0);
                }
            };

            const undoTask = (key) => {
                triggerHaptic();
                setRecords(prev => { const n = { ...prev }; delete n[key]; return n; });
            };

            const handleUpdateSlide = (exId, subId, slides) => {
                setExams(prev => prev.map(ex => ex.id === exId ? { ...ex, subjects: ex.subjects.map(s => s.id === subId ? { ...s, slides: parseInt(slides) || 0 } : s) } : ex));
            };

            // محاسبات زمان‌بندی
            const schedule = useMemo(() => {
                if (!startDate || exams.length === 0) return []; 
                const plan = [];
                const left = {};
                exams.forEach(ex => ex.subjects.forEach(s => left[s.id] = { 1: s.slides, 2: s.slides, 3: s.slides }));

                const sDate = new Date(startDate + 'T00:00:00');
                const validExams = exams.filter(e => e.date);
                if(validExams.length === 0) return [];

                const mDate = new Date(Math.max(...validExams.map(e => new Date(e.date + 'T00:00:00'))));
                let curr = new Date(sDate);
                let absoluteDayCount = 1;

                while (curr < mDate) {
                    const dStr = getLocalISODate(curr);
                    const currentInternalDay = absoluteDayCount;
                    absoluteDayCount++;

                    if (skipped.includes(dStr)) { curr.setDate(curr.getDate() + 1); continue; }

                    const tasks = [];
                    exams.forEach(ex => {
                        if(!ex.date) return;
                        const exDate = new Date(ex.date + 'T00:00:00');
                        if (curr >= exDate) return;

                        const totalDays = Math.ceil((exDate - sDate) / 86400000);
                        if(totalDays <= 0) return;

                        const p1D = Math.max(1, Math.floor(totalDays * 0.45));
                        const p2D = Math.max(1, Math.floor(totalDays * 0.35));
                        const dayIdx = Math.floor((curr - sDate) / 86400000);

                        ex.subjects.forEach(sub => {
                            if (sub.slides <= 0) return;
                            let phase, remD;
                            if (dayIdx < p1D) { phase = 1; remD = p1D - dayIdx; }
                            else if (dayIdx < p1D + p2D) { phase = 2; remD = (p1D + p2D) - dayIdx; }
                            else { phase = 3; remD = totalDays - dayIdx; }

                            const key = `${dStr}_${ex.id}_${sub.id}_${phase}`;
                            const rec = records[key];
                            
                            let load = remD > 0 ? Math.ceil(left[sub.id][phase] / remD) : 0;
                            if (rebalance.active && dStr <= rebalance.until && ex.id !== rebalance.nearestExamId) load = 0;

                            const amt = rec?.isCustom ? rec.amount : Math.min(load, left[sub.id][phase]);

                            if (rec?.status === 'done' || rec?.status === 'skipped' || (!rec?.isCustom && amt > 0) || (rec?.isCustom && (rec.amount > 0 || rec.status === 'missed'))) {
                                tasks.push({ key, exName: ex.name, subName: sub.name, phase, amt, status: rec?.status || 'pending', isCustom: rec?.isCustom });
                                
                                if (rec?.status === 'done' || (!rec?.status && amt > 0)) {
                                    left[sub.id][phase] -= amt;
                                }
                            }
                        });
                    });

                    if (tasks.length > 0) plan.push({ date: new Date(curr), dStr, internalDay: currentInternalDay, tasks });
                    curr.setDate(curr.getDate() + 1);
                }
                return plan;
            }, [exams, records, skipped, rebalance, startDate]);

            // تولید تقویم
            const calendarGrid = useMemo(() => {
                if (!startDate || exams.length === 0) return [];
                const sDate = new Date(startDate + 'T00:00:00');
                const validExams = exams.filter(e => e.date);
                if(validExams.length === 0) return [];
                
                const mDate = new Date(Math.max(...validExams.map(e => new Date(e.date + 'T00:00:00'))));
                
                const startSun = new Date(sDate);
                startSun.setDate(startSun.getDate() - startSun.getDay());

                const endSat = new Date(mDate);
                if (endSat.getDay() !== 6) endSat.setDate(endSat.getDate() + (6 - endSat.getDay()));

                const grid = [];
                let curr = new Date(startSun);
                const scheduleMap = Object.fromEntries(schedule.map(s => [s.dStr, s]));

                while (curr <= endSat) {
                    const dStr = getLocalISODate(curr);
                    const dailyExams = exams.filter(e => e.date === dStr);
                    const sch = scheduleMap[dStr];
                    
                    const totalSlides = sch ? sch.tasks.reduce((acc, t) => acc + (t.status !== 'skipped' ? t.amt : 0), 0) : 0;
                    
                    grid.push({
                        date: new Date(curr), dStr, dailyExams, isSkipped: skipped.includes(dStr), 
                        totalSlides, isToday: dStr === todayISO, outOfBounds: curr < sDate || curr > mDate,
                        internalDay: sch?.internalDay || null
                    });
                    curr.setDate(curr.getDate() + 1);
                }
                return grid;
            }, [exams, schedule, skipped, todayISO, startDate]);

            const xp = useMemo(() => Object.values(records).reduce((a, b) => b.status === 'done' ? a + b.amount : a, 0), [records]);
            
            const dashboardStats = useMemo(() => exams.map(exam => {
                let totalP1 = 0, doneP1 = 0;
                exam.subjects.forEach(sub => {
                    totalP1 += sub.slides;
                    Object.keys(records).forEach(key => { if (key.includes(`_${exam.id}_${sub.id}_1`) && records[key].status === 'done') doneP1 += records[key].amount; });
                });
                const diff = exam.date ? Math.ceil((new Date(exam.date + 'T00:00:00') - new Date()) / 86400000) : 0;
                return { id: exam.id, name: exam.name, daysLeft: Math.max(0, diff), percent: totalP1 === 0 ? 0 : Math.min(100, Math.round((doneP1 / totalP1) * 100)) };
            }), [exams, records]);

            const weeklyData = useMemo(() => {
                const data = []; const today = new Date(); let maxSlides = 10;
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(today); d.setDate(today.getDate() - i); const dStr = getLocalISODate(d);
                    let count = 0;
                    Object.keys(records).forEach(key => { if (key.startsWith(dStr) && records[key].status === 'done') count += records[key].amount; });
                    if (count > maxSlides) maxSlides = count;
                    data.push({ dateStr: dStr, label: new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(d), count });
                }
                return { data, maxCount: maxSlides };
            }, [records]);


            // ==========================================
            // صفحات وضعیت
            // ==========================================
            if (networkError) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 text-rose-800" dir="rtl">
                        <Icons.Warning size={64} className="text-rose-500 mb-6" />
                        <h2 className="text-xl font-black mb-4 text-center">خطا در ارتباط با سرور</h2>
                        <div className="bg-rose-100 p-4 rounded-xl text-sm mb-6 text-rose-900 border border-rose-200 w-full" dir="ltr" style={{wordBreak: 'break-all'}}>
                            <b>Error Details:</b><br/>{detailedError}
                        </div>
                        <button onClick={()=>window.location.reload()} className="px-6 py-3 bg-rose-600 text-white rounded-xl font-bold shadow-lg shadow-rose-500/30">تلاش مجدد</button>
                    </div>
                );
            }

            if (authLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900 text-indigo-600 dark:text-indigo-400">
                        <div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                        <h2 className="font-bold">در حال برقراری ارتباط...</h2>
                    </div>
                );
            }

            // ==========================================
            // صفحه خوش‌آمدگویی قبل از لاگین
            // ==========================================
            if (!user) {
                if (!showAuthForm) {
                    return (
                        <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                            <div className="absolute top-[-10%] left-[-10%] w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-rose-500/20 rounded-full blur-3xl"></div>
                            
                            <div className="w-full max-w-sm space-y-8 text-center z-10 fade-in">
                                <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-indigo-500/40">
                                    <Icons.Flame size={48} className="text-white" />
                                </div>
                                
                                <div>
                                    <h1 className="text-3xl font-black text-slate-800 dark:text-white mb-3">مربی پرو</h1>
                                    <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed px-4">
                                        برنامه‌ریز هوشمند و کاملاً شخصی، همراه با تقسیم خودکار مباحث و مرورهای منظم برای موفقیت شما.
                                    </p>
                                </div>

                                <div className="space-y-4 text-right bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-white dark:border-slate-700">
                                    <div className="flex items-start gap-4">
                                        <div className="p-2.5 bg-orange-100 text-orange-600 dark:bg-orange-900/40 dark:text-orange-400 rounded-xl"><Icons.Planner /></div>
                                        <div><h3 className="font-bold text-sm dark:text-white">برنامه‌ریزی هوشمند</h3><p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">تقسیم اتوماتیک حجم کارها تا روز هدف</p></div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2.5 bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400 rounded-xl"><Icons.Timer size={20}/></div>
                                        <div><h3 className="font-bold text-sm dark:text-white">تکنیک پومودورو</h3><p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">مدیریت زمان مطالعه با تایمر داخلی</p></div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2.5 bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400 rounded-xl"><Icons.Chart /></div>
                                        <div><h3 className="font-bold text-sm dark:text-white">کاملاً شخصی‌سازی شده</h3><p className="text-[10px] text-slate-500 dark:text-slate-400 mt-1">مناسب برای کنکور، دانشگاه، آیلتس و پروژه‌ها</p></div>
                                    </div>
                                </div>

                                <button onClick={() => setShowAuthForm(true)} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold shadow-lg shadow-indigo-500/30 transition-all transform hover:scale-[1.02]">
                                    شروع کنید (ورود / ثبت‌نام)
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 dark:bg-slate-900">
                        <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl w-full max-w-sm modal-animate relative">
                            <button onClick={() => setShowAuthForm(false)} className="absolute top-4 left-4 p-2 text-slate-400 hover:text-slate-600"><Icons.Undo /></button>
                            <div className="flex justify-center mb-6 text-indigo-600 dark:text-indigo-400 mt-2">
                                <Icons.User size={48} />
                            </div>
                            <h2 className="text-2xl font-black text-center mb-8 text-slate-800 dark:text-white">
                                {authMode === 'login' ? 'ورود به حساب' : 'ثبت نام جدید'}
                            </h2>
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">نام کاربری</label>
                                    <input type="text" dir="ltr" placeholder="مثال: ali123" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">رمز عبور (حداقل ۶ حرف)</label>
                                    <input type="password" dir="ltr" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-slate-100 dark:bg-slate-700 rounded-2xl outline-none font-bold text-center dark:text-white focus:ring-2 focus:ring-indigo-500" required />
                                </div>
                                
                                {authError && <div className="bg-rose-100 text-rose-600 p-3 rounded-xl text-xs font-bold text-center animate-bounce leading-relaxed">{authError}</div>}
                                
                                <button type="submit" className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold mt-4 shadow-lg shadow-indigo-500/30 transition-all">
                                    {authMode === 'login' ? 'ورود به برنامه' : 'ثبت نام و ساخت حساب'}
                                </button>

                                <div className="relative my-6">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200 dark:border-slate-700"></div></div>
                                    <div className="relative flex justify-center text-xs"><span className="bg-white dark:bg-slate-800 px-3 text-slate-400 font-bold">یا</span></div>
                                </div>

                                <button type="button" onClick={handleGoogleLogin} className="w-full py-4 bg-white dark:bg-slate-700 border-2 border-slate-100 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-white rounded-2xl font-bold shadow-sm transition-all flex items-center justify-center gap-3">
                                    <Icons.Google /> ورود با حساب گوگل
                                </button>

                            </form>
                            <div className="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                                {authMode === 'login' ? 'حساب کاربری ندارید؟ ' : 'قبلاً حساب ساخته‌اید؟ '}
                                <button onClick={() => {setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError('');}} className="text-indigo-600 dark:text-indigo-400 font-black">
                                    {authMode === 'login' ? 'ثبت نام کنید' : 'وارد شوید'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // ویزارد راه‌اندازی اهداف (فقط برای کاربران تازه وارد)
            // ==========================================
            if (user && isDbReady && !hasSeenOnboarding) {
                return (
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center p-6 fade-in relative overflow-hidden">
                        <div className="absolute top-[-10%] right-[-10%] w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-indigo-500/20 rounded-full blur-3xl"></div>

                        <div className="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden z-10 border border-slate-100 dark:border-slate-700 relative">
                            
                            {/* نوار پیشرفت */}
                            <div className="flex h-2 bg-slate-100 dark:bg-slate-700">
                                <div className={`bg-indigo-600 transition-all duration-500 h-full ${wizardStep === 1 ? 'w-1/3' : wizardStep === 2 ? 'w-2/3' : 'w-full'}`}></div>
                            </div>

                            {/* Header */}
                            <div className="p-6 pb-2 text-center">
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-1">راه‌اندازی مربی پرو</h2>
                                <p className="text-xs text-slate-500 dark:text-slate-400">
                                    {wizardStep === 1 && "قدم اول: زمان‌بندی"}
                                    {wizardStep === 2 && "قدم دوم: تعریف هدف اصلی"}
                                    {wizardStep === 3 && "قدم نهایی: ساختار درسی"}
                                </p>
                            </div>

                            {/* محتوای مراحل */}
                            <div className="p-6 pt-4">
                                {wizardStep === 1 && (
                                    <div className="space-y-6 fade-in">
                                        <div className="w-20 h-20 bg-indigo-50 dark:bg-indigo-900/30 rounded-full flex items-center justify-center mx-auto text-indigo-600 dark:text-indigo-400 mb-6">
                                            <Icons.Calendar size={32} />
                                        </div>
                                        <div className="text-center mb-6">
                                            <p className="text-sm text-slate-600 dark:text-slate-300 font-bold mb-4 leading-relaxed">
                                                برای شروع، از چه تاریخی می‌خواهید برنامه‌ریزی و مطالعه شما آغاز شود؟
                                            </p>
                                            <input 
                                                type="date" 
                                                value={startDate} 
                                                onChange={(e) => setStartDate(e.target.value)}
                                                style={{colorScheme: dark ? 'dark' : 'light'}}
                                                className="w-full p-4 bg-slate-100 dark:bg-slate-900 border border-indigo-200 dark:border-slate-600 rounded-2xl text-sm font-bold text-center text-indigo-700 dark:text-white outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <button 
                                            onClick={() => { if(startDate) setWizardStep(2); else alert('لطفا یک تاریخ انتخاب کنید.'); }} 
                                            className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-colors"
                                        >
                                            تایید و ادامه
                                        </button>
                                    </div>
                                )}

                                {wizardStep === 2 && (
                                    <div className="space-y-6 fade-in">
                                        <div className="w-20 h-20 bg-rose-50 dark:bg-rose-900/30 rounded-full flex items-center justify-center mx-auto text-rose-600 dark:text-rose-400 mb-6">
                                            <Icons.Flame size={32} />
                                        </div>
                                        <div className="space-y-4 mb-6">
                                            <p className="text-sm text-slate-600 dark:text-slate-300 font-bold text-center leading-relaxed mb-4">
                                                اولین هدف بزرگ یا آزمونی که برای آن آماده می‌شوید چیست؟
                                            </p>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1 px-1">نام هدف (مثل: کنکور، آیلتس...)</label>
                                                <input value={wizGoalName} onChange={e=>setWizGoalName(e.target.value)} placeholder="مثال: آزمون آیلتس" className="w-full p-4 bg-slate-100 dark:bg-slate-900 border-none rounded-2xl text-sm font-bold dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                                            </div>

                                                        <div className="flex justify-between items-center pt-2 border-t dark:border-slate-700/50">
                                                            <span className={`text-[10px] font-bold ${t.status === 'done' ? 'text-emerald-600 dark:text-emerald-400' : t.status === 'skipped' ? 'text-slate-500 dark:text-slate-400' : 'text-rose-600 dark:text-rose-400'}`}>
                                                                {t.status === 'done' ? 'تکمیل شد' : (t.status === 'skipped' ? 'رد شد (حجم آن فردا پخش می‌شود)' : 'نخوانده ماند')}
                                                            </span>
                                                            <button onClick={() => undoTask(t.key)} className="text-indigo-600 dark:text-indigo-400 p-1 bg-indigo-50 dark:bg-indigo-900/30 rounded-lg hover:bg-indigo-100 transition-colors"><Icons.Undo /></button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-6 fade-in">
                                <div className="bg-white dark:bg-slate-800 p-5 rounded-3xl border dark:border-slate-700 shadow-sm">
                                    <h2 className="text-lg font-black dark:text-white mb-2 flex items-center gap-2"><Icons.Calendar /> نقشه راه تا اهداف</h2>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">یک نمای کلی از حجم مطالعه/کار در کل مسیر برنامه‌ریزی شده.</p>
                                    
                                    {(!startDate || exams.length === 0) ? (
                                        <div className="text-center py-6 text-slate-400 font-bold text-sm">تاریخ شروع یا اهداف مشخص نشده‌اند.</div>
                                    ) : (
                                        <>
                                            <div className="grid grid-cols-7 gap-1.5 mb-2 text-center text-[10px] font-bold text-slate-400 dark:text-slate-500" dir="ltr">
                                                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                                            </div>
                                            
                                            <div className="grid grid-cols-7 gap-1.5" dir="ltr">
                                                {calendarGrid.map((day, idx) => {
                                                    let bgClass = "bg-slate-50 dark:bg-slate-900/40 text-slate-400";
                                                    let textClass = "text-slate-400";

                                                    if (day.outOfBounds) {
                                                        bgClass = "bg-transparent opacity-30";
                                                        textClass = "text-slate-300 dark:text-slate-700";
                                                    } else if (day.isSkipped) {
                                                        bgClass = "skipped-pattern border border-slate-200 dark:border-slate-700";
                                                        textClass = "text-slate-400";
                                                    } else if (day.dailyExams.length > 0) {
                                                        bgClass = "bg-rose-500 shadow-md shadow-rose-500/30";
                                                        textClass = "text-white";
                                                    } else if (day.totalSlides > 150) {
                                                        bgClass = "bg-orange-500 shadow-sm shadow-orange-500/20";
                                                        textClass = "text-white";
                                                    } else if (day.totalSlides > 50) {
                                                        bgClass = "bg-indigo-500";
                                                        textClass = "text-white";
                                                    } else if (day.totalSlides > 0) {
                                                        bgClass = "bg-indigo-100 dark:bg-indigo-900/60";
                                                        textClass = "text-indigo-800 dark:text-indigo-300";
                                                    }

                                                    const isSelected = selectedCalDate === day.dStr;

                                                    return (
                                                        <button key={idx} onClick={() => { if(!day.outOfBounds) { triggerHaptic(); setSelectedCalDate(day.dStr); setActiveTab('planner'); } }} className={`aspect-square rounded-xl flex flex-col items-center justify-center relative transition-all duration-200 ${bgClass} ${textClass} ${isSelected && !day.outOfBounds ? 'ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-800 ring-indigo-600 dark:ring-indigo-400 scale-110 z-10' : 'hover:scale-105'}`} disabled={day.outOfBounds}>
                                                            <span className="text-[13px] font-bold font-mono">{day.date.getDate()}</span>
                                                            {!day.outOfBounds && day.totalSlides > 0 && !day.isSkipped && (
                                                                <span className="text-[8px] font-bold mt-0.5 opacity-80" dir="rtl">{day.totalSlides} <span className="text-[6px]">واحد</span></span>
                                                            )}
                                                            {day.isSkipped && (
                                                                <span className="text-[8px] font-bold mt-0.5 opacity-70">تعطیل</span>
                                                            )}
                                                            {day.dailyExams.length > 0 && (
                                                                <span className="text-[8px] font-black mt-0.5">هدف!</span>
                                                            )}
                                                            {day.isToday && <span className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-current opacity-70"></span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6 fade-in">
                                
                                <div className="bg-rose-50 dark:bg-slate-800 rounded-3xl border border-rose-100 dark:border-slate-700 p-4 shadow-sm flex justify-between items-center">
                                    <div>
                                        <h4 className="font-bold text-sm text-rose-900 dark:text-white flex items-center gap-2"><Icons.User size={16}/> حساب کاربری</h4>
                                        <p className="text-[10px] text-rose-500 dark:text-slate-400 mt-1">{user.email?.split('@')[0] || user.displayName || 'کاربر'}</p>
                                    </div>
                                    <button onClick={handleLogout} className="bg-rose-600 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2">
                                        خروج <Icons.LogOut />
                                    </button>
                                </div>

                                <div className={`bg-indigo-50 dark:bg-slate-800 rounded-3xl border ${!startDate ? 'border-indigo-400 dark:border-indigo-500 shadow-md shadow-indigo-200 dark:shadow-indigo-900/20' : 'border-indigo-100 dark:border-slate-700'} p-4 flex justify-between items-center transition-all`}>
                                    <div>
                                        <h4 className="font-bold text-sm text-indigo-900 dark:text-white">تاریخ شروع مطالعه</h4>
                                        {!startDate && <p className="text-[10px] text-indigo-500 mt-1 font-bold">حتما این بخش را تکمیل کنید!</p>}
                                    </div>
                                    <input 
                                        type="date" 
                                        value={startDate} 
                                        onChange={(e) => setStartDate(e.target.value)}
                                        style={{colorScheme: dark ? 'dark' : 'light'}}
                                        className="bg-white dark:bg-slate-900 border border-indigo-200 dark:border-slate-600 rounded-xl text-xs font-bold text-indigo-700 dark:text-white p-2 outline-none cursor-pointer"
                                    />
                                </div>

                                <div className="flex justify-between items-center mt-8 mb-2 px-2 border-b-2 border-indigo-500 dark:border-indigo-500/50 pb-2">
                                    <h3 className="text-sm font-black dark:text-white">اهداف و پروژه‌ها</h3>
                                    <button onClick={() => {setVal1(''); setVal2(''); setModal({open:true, type:'add_exam'});}} className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold shadow-md shadow-indigo-500/30 transition-transform hover:scale-105">+ افزودن هدف جدید</button>
                                </div>

                                {exams.length === 0 && (
                                    <div className="text-center py-6 text-slate-400 text-xs font-bold bg-slate-100 dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
                                        هیچ هدفی ثبت نشده. روی "افزودن هدف جدید" کلیک کنید.
                                    </div>
                                )}

                                {exams.map(ex => (
                                    <div key={ex.id} className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm transition-all hover:shadow-md">
                                        <div className="p-4 bg-slate-50 dark:bg-slate-900/50 border-b dark:border-slate-700 flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold text-sm dark:text-white flex items-center gap-2">
                                                    {ex.name} 
                                                </h4>
                                                <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1">
                                                    تاریخ: <span dir="ltr" className="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 px-1.5 py-0.5 rounded-md font-mono">{ex.date ? formatDate(new Date(ex.date)) : '-'}</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => {setVal1(''); setVal2(''); setModal({open:true, type:'add_subject', data:{exId:ex.id}});}} className="bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400 px-2 py-1.5 rounded-lg text-[10px] font-bold">+ زیرمبحث</button>
                                                <button onClick={() => setModal({open:true, type:'confirm', data:{msg:'آیا از حذف کامل این هدف و تمام زیرمباحث آن مطمئن هستید؟', fn:()=>setExams(p=>p.filter(e=>e.id!==ex.id))}})} className="text-rose-400 bg-rose-50 dark:bg-rose-900/20 p-1.5 rounded-lg"><Icons.Trash /></button>
                                            </div>
                                        </div>
                                        <div className="p-2 space-y-1">
                                            {ex.subjects.length === 0 && <p className="text-center text-[10px] text-slate-400 py-3">زیرمبحثی اضافه نشده است.</p>}
                                            {ex.subjects.map(s => (
                                                <div key={s.id} className="flex justify-between items-center p-3 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-2xl transition-colors">
                                                    <span className="text-[11px] dark:text-white truncate pr-2 font-bold">{s.name}</span>
                                                    <div className="flex items-center gap-2"><input type="number" value={s.slides} onChange={e => handleUpdateSlide(ex.id, s.id, e.target.value)} className="w-14 bg-slate-100 dark:bg-slate-900 border-none rounded-lg text-center text-xs font-bold text-indigo-600 dark:text-indigo-400 p-1.5 outline-none" /><button onClick={() => setExams(p => p.map(e => e.id===ex.id ? {...e, subjects:e.subjects.filter(x=>x.id!==s.id)} : e))} className="text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/30 p-1.5 rounded-lg transition-colors"><Icons.Trash /></button></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 glass-nav bg-white/90 dark:bg-slate-900/90 border-t dark:border-slate-800 p-4 pb-8 flex justify-around">
                        <button onClick={() => {triggerHaptic(); setActiveTab('dashboard');}} className={`transition-all duration-300 flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-indigo-600 dark:text-indigo-400 scale-110' : 'text-slate-400 dark:text-slate-500'}`}><Icons.Dashboard /> <span className="text-[9px] font-bold">داشبورد</span></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('planner');}} className={`transition-all duration-300 flex flex-col items-center gap-1 ${activeTab === 'planner' ? 'text-indigo-600 dark:text-indigo-400 scale-110' : 'text-slate-400 dark:text-slate-500'}`}><Icons.Planner /> <span className="text-[9px] font-bold">برنامه‌ریز</span></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('calendar');}} className={`transition-all duration-300 flex flex-col items-center gap-1 ${activeTab === 'calendar' ? 'text-indigo-600 dark:text-indigo-400 scale-110' : 'text-slate-400 dark:text-slate-500'}`}><Icons.Calendar /> <span className="text-[9px] font-bold">تقویم</span></button>
                        <button onClick={() => {triggerHaptic(); setActiveTab('settings');}} className={`transition-all duration-300 flex flex-col items-center gap-1 ${activeTab === 'settings' ? 'text-indigo-600 dark:text-indigo-400 scale-110' : 'text-slate-400 dark:text-slate-500'}`}><Icons.Settings /> <span className="text-[9px] font-bold">تنظیمات</span></button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
